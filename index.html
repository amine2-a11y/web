<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>  </title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
  <link rel="stylesheet" href="youth-theme.css">
<style>
/* Compact startup screen */
#compact-start{
  position:fixed; inset:0; z-index:99999;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#090d1c,#17133b);
  transition:opacity .35s ease,visibility .35s ease;
}
#compact-start.hide{opacity:0;visibility:hidden;pointer-events:none}
.compact-card{
  width:min(86vw,330px); padding:24px 18px; text-align:center;
  border-radius:22px; background:rgba(20,27,52,.94);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}
.compact-logo{
  width:58px;height:58px;margin:0 auto 13px;border-radius:17px;
  display:grid;place-items:center;font-weight:800;font-size:24px;
  background:linear-gradient(135deg,#7c5cff,#00d4ff);color:white;
}
.compact-title{font-size:21px;font-weight:800;color:#fff;margin:0 0 6px}
.compact-sub{font-size:13px;color:#aab3cf;margin:0 0 18px}
.compact-load{
  height:5px;border-radius:99px;overflow:hidden;background:#252d4d
}
.compact-load span{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#7c5cff,#00d4ff);
  animation:compactLoading 1.15s ease forwards;
}
@keyframes compactLoading{to{width:100%}}
</style>
</head>
<body><div id="compact-start">
<div class="compact-card">
<div class="compact-logo">PS4</div>
<h2 class="compact-title">Starting</h2>
<p class="compact-sub">Preparing the page…</p>
<div class="compact-load"><span></span></div>
</div></div>
<div id="brand"><b>AMINE PS4</b></div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function(){
  var cache=window.applicationCache;
  function go(){ location.replace("jb.html?offline=1&v=1352"); }
  function run(){ setTimeout(go,120); }
  if(!cache || !document.documentElement.hasAttribute("manifest")){ run(); return; }
  if(!navigator.onLine){ run(); return; }
  if(cache.status===cache.IDLE || cache.status===cache.UPDATEREADY){ try{if(cache.status===cache.UPDATEREADY)cache.swapCache();}catch(e){} run(); return; }
  cache.addEventListener("cached",run,false);
  cache.addEventListener("noupdate",run,false);
  cache.addEventListener("error",run,false);
  cache.addEventListener("obsolete",run,false);
  setTimeout(run,4000);
})();
</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  var s=document.getElementById('compact-start');
  if(!s)return;
  setTimeout(function(){s.classList.add('hide');setTimeout(function(){s.remove()},400)},1250);
});
</script>
<div style="position:fixed;top:10px;left:50%;transform:translateX(-50%);font:700 15px Arial;color:#76ff70;letter-spacing:2px;opacity:.9;pointer-events:none">AMINE PS4</div></body>
</html>
