<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AMINE PS4</title>
    <style>
      :root { --accent:#ff6a00; --accent2:#ffb347; }
      * { box-sizing:border-box; }
      html, body { margin:0; padding:0; min-height:100%; background:#05080b url("ps4-background.jpg") center center / cover fixed no-repeat; color:#eef3f7; font:15px/1.45 "Segoe UI",system-ui,sans-serif; }
      body::before { content:""; position:fixed; inset:0; background:linear-gradient(135deg,rgba(2,5,8,.55),rgba(4,8,12,.18) 48%,rgba(2,4,7,.62)); pointer-events:none; }
      #brand { position:relative; z-index:3; text-align:center; padding:10px 14px; background:rgba(5,9,13,.74); border-bottom:1px solid rgba(255,145,60,.28);   }
      #brand img { width:30px; height:30px; margin-right:9px; border-radius:50%; vertical-align:middle;  }
      #brand b { font-size:15px; font-weight:800; letter-spacing:.16em; color:#fff; vertical-align:middle; text-shadow:0 2px 10px #000; }
      /* Professional activation indicator: a pulsing heart replaces the old spinning circle. */
      #spin { position:fixed; z-index:3; top:50%; left:50%; width:76px; height:76px; margin:-38px 0 0 -38px; border:0; border-radius:0; background:transparent; animation:heartBeat 1.05s ease-in-out infinite;  }
      #spin::before { content:"♥"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ff6a00; font-size:68px; line-height:1; text-shadow:0 0 7px rgba(255,106,0,.55); }
      @keyframes heartBeat { 0%,100%{transform:scale(1)} 12%{transform:scale(1.13)} 24%{transform:scale(.98)} 36%{transform:scale(1.08)} 52%{transform:scale(1)} }
      #msg { position:fixed; z-index:3; top:calc(50% + 66px); left:0; right:0; transform:translateY(-50%); text-align:center; font-size:14px; color:#fff; letter-spacing:1.5px; text-shadow:0 2px 10px #000; display:none; }
      #wrap { position:relative; z-index:2; padding:0; width:min(900px,calc(100% - 34px)); margin:28px auto; }
      #state, #out { display:none; }
      body.done #spin, body.fail #spin { display:none; }
      body.fail #msg { display:block; color:#ffad99; }
      body.done #msg { display:block; color:#a8ffc9; font-weight:800; letter-spacing:2px; }
      body.log #spin, body.log #msg { display:none; }
      body.log #wrap { padding:16px 18px; background:rgba(6,10,15,.78); border:1px solid rgba(255,170,95,.22); border-radius:16px;   }
      body.log #state { display:block; font-size:22px; font-weight:800; margin:0 0 8px; }
      body.log #out { display:block; white-space:pre-wrap; font:12px/1.45 Consolas,monospace; color:#dbe4eb; background:rgba(7,10,14,.82); border:1px solid #303944; border-radius:10px; padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto; }
      .ok,.safe { color:#9ff0bf; } .bad,.danger { color:#ff9b82; } .warn { color:#ffd08a; } code { color:#b9c9dc; }
</style>
